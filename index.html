<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RiftBound</title>

    <link rel="stylesheet" href="css/menu.css">
</head>

<body>

    <div class="screen">

        <div class="menu">

            <h1>RIFTBOUND</h1>

            <p class="subtitle">A Pixel-Action Adventure</p>

            <button id="playButton">PLAY</button>

            <div class="controls">
                <p>ARROW KEYS — MOVE</p>
                <p>SPACE — JUMP</p>
                <p>X — ATTACK</p>
                <p>SHIFT — ROLL</p>
            </div>

        </div>

    </div>

    <script>
        document
            .getElementById("playButton")
            .addEventListener("click", () => {
                window.location.href = "game.html";
            });
    </script>

</body>
</html>
